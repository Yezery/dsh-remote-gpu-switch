<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="dsh-remote-gpu-switch">
  <title>dsh-remote-gpu-switch</title>

  <!-- white paper -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- the next workspace: a second pane, tilted, waiting to be switched to -->
  <g transform="rotate(-8 300 218)">
    <rect x="192" y="110" width="216" height="216" rx="24"
          fill="#ffffff" stroke="#d3cec4" stroke-width="12"/>
  </g>

  <!-- the active workspace: this is the pane you are working in -->
  <rect x="120" y="174" width="232" height="232" rx="26"
        fill="#ffffff" stroke="#22201c" stroke-width="14"/>

  <!-- the GPU of THIS workspace: board, gold fingers, die — fused inside the pane -->
  <g fill="none" stroke="#22201c" stroke-linecap="square">
    <rect x="186" y="240" width="100" height="100" rx="7" stroke-width="12"/>
    <g stroke-width="8">
      <path d="M206 240 V218"/>
      <path d="M236 240 V218"/>
      <path d="M266 240 V218"/>
      <path d="M206 340 V362"/>
      <path d="M236 340 V362"/>
      <path d="M266 340 V362"/>
    </g>
  </g>
  <rect x="220" y="274" width="32" height="32" rx="2" fill="#22201c"/>
</svg>
