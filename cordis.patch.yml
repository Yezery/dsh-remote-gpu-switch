# Bundle patch: insert the dsh-remote-gpu-switch plugin row.
#
# `config` reaches the host plugin's apply(ctx, config) verbatim, so these are
# the plugin's tunables. A user patch layer can override them by id:
#
#   - id: dsh-remote-gpu-switch
#     config:
#       intervalMs: 5000
#
- insert:
    - id: dsh-remote-gpu-switch
      name: dsh-remote-gpu-switch
      config:
        # How often the host re-probes the current workspace's GPU (ms).
        # A status chip wants seconds, not a CPU cycle: 8 s is plenty, and
        # polling stops entirely while no panel is watching (idleStopMs).
        intervalMs: 8000
        # Upper bound for one probe, local or remote (ms).
        commandTimeoutMs: 15000
        # Stop probing this long after the last client asked (ms); 0 keeps polling.
        idleStopMs: 60000
        # How many samples the client-side sparkline keeps (20 × 8 s ≈ 2.6 min).
        historyLength: 20
        # command: '…'       # override the REMOTE probe command
        # localCommand: '…'  # override the LOCAL probe command
